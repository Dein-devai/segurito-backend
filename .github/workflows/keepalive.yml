name: keepalive
on:
  schedule:
    # Cada 10 minutos, 24/7. Render free duerme tras 15min de inactividad.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL repository variable not set"; exit 1
          fi
          curl -fsS --max-time 30 "$BACKEND_URL/health" | head -c 500
          echo
